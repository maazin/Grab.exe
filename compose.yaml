services:
  app:
    build: .
    image: grab:latest
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    volumes:
      - grab-data:/data
      - grab-downloads:/downloads
    # Only for checking the app from the home machine itself. The tunnel reaches it over the compose network,
    # and outside DEV_MODE every /api request without a Cloudflare Access token gets a 401.
    ports:
      - "127.0.0.1:${GRAB_PORT:-8000}:8000"

  # Starts when COMPOSE_PROFILES=tunnel is set in .env (see .env.example).
  cloudflared:
    image: cloudflare/cloudflared:2026.9.3
    profiles: [tunnel]
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on:
      - app

  # Starts when COMPOSE_PROFILES=tailscale is set in .env. Joins your tailnet as its own device named "grab"
  # and serves the app at https://grab.<tailnet>.ts.net, tailnet only (Funnel stays off).
  # First start: open the login link from `docker compose logs tailscale`, or set TS_AUTHKEY.
  tailscale:
    image: tailscale/tailscale:v1.102.5
    profiles: [tailscale]
    hostname: grab
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/start.sh"]
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:-}
    volumes:
      - grab-tailscale:/var/lib/tailscale
      - ./docker/tailscale-start.sh:/start.sh:ro
    depends_on:
      - app

volumes:
  grab-data:
  grab-downloads:
  grab-tailscale:
