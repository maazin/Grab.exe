[project]
name = "grab-backend"
version = "1.0.0"
requires-python = ">=3.12"

[tool.ruff]
line-length = 130
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "BLE", "SIM"]
ignore = ["SIM105"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["live: hits the real YouTube; run with -m live"]
addopts = "-m 'not live'"
